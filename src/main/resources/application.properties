spring.application.name=swingapp
# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/swingapp
spring.datasource.username=swinguser
spring.datasource.password=swingpass
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis\uff08\u4efb\u610f\uff1aMapper XML\u3092\u7f6e\u304f\u306a\u3089\uff09
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=com.ikkei.swingapp.domain
# headless\u74b0\u5883\u3092\u660e\u793a
spring.main.headless=false