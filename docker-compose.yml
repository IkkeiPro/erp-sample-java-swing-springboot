services:
  postgres:
    image: postgres:16
    container_name: swingapp-postgres
    environment:
      POSTGRES_DB: swingapp
      POSTGRES_USER: swinguser
      POSTGRES_PASSWORD: swingpass
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swinguser -d swingapp"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata: